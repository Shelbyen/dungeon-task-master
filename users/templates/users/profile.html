{% extends 'base.html' %}

{% block title %}Профиль{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Профиль пользователя</h4>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <p><strong>Email:</strong> {{ user.email }}</p>
                        </div>
                        <div class="col-md-6">
                            <p><strong>Имя:</strong> {{ user.name }}</p>
                        </div>
                    </div>
                    
                    <div class="mt-4">
                        <a href="{% url 'tasks:task_list' %}" class="btn btn-primary">Мои задачи</a>
                        <a href="{% url 'users:profile' %}" class="btn btn-secondary">Обновить профиль</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
