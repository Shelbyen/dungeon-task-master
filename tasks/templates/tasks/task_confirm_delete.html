{% extends 'base.html' %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-danger">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0">Подтверждение удаления</h4>
                </div>
                <div class="card-body">
                    <div class="text-center mb-4">
                        <i class="bi bi-exclamation-triangle display-1 text-danger"></i>
                    </div>

                    <p class="lead text-center mb-4">
                        Вы уверены, что хотите удалить задачу?
                    </p>

                    <div class="alert alert-danger">
                        <strong>"{{ object.name }}"</strong>
                    </div>

                    <div class="alert alert-warning">
                        <i class="bi bi-info-circle me-2"></i>
                        Это действие нельзя отменить. Все данные о задаче будут безвозвратно удалены.
                    </div>

                    <form method="post" class="mt-4">
                        {% csrf_token %}
                        <div class="d-grid gap-3">
                            <button type="submit" class="btn btn-danger btn-lg">
                                <i class="bi bi-trash me-2"></i>Удалить навсегда
                            </button>
                            <a href="{% url 'tasks:task_list' %}" class="btn btn-outline-secondary btn-lg">
                                <i class="bi bi-arrow-left me-2"></i>Отмена
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
